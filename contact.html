<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
  
</head>
<body>
  <div class="container">
    <header></header>

    <main>
      <section class="contact-form-section">
        <h2>Mande sua Mensagem</h2>
        <form action="#" method="POST" class="contact-form">
          <label for="name">Nome:</label>
          <input type="text" id="name" name="name" placeholder="Seu nome" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Seu email" required>

          <label for="message">Mensagem:</label>
          <textarea id="message" name="message" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>

          <button type="submit">Enviar</button>
        </form>
      </section>

      <section class="social-links">
        <h2>Minhas Redes</h2>
        <ul>
          <li><a href="https://github.com/seuusuario" target="_blank">GitHub</a></li>
          <li><a href="https://linkedin.com/in/seuusuario" target="_blank">LinkedIn</a></li>
          <li><a href="https://instagram.com/seuusuario" target="_blank">Instagram</a></li>
        </ul>
      </section>
    </main>
    
<footer></footer>

  </div>
  
  <script src="js/include.js"></script>
</body>
</html>
